version: "3.8"

services:
  grimseth-frontpage:
    image: nginx:stable-alpine
    configs:
      - source: frontpage_html
        target: /usr/share/nginx/html/index.html
      - source: frontpage_favicon
        target: /usr/share/nginx/html/favicon.svg
      - source: frontpage_nginx
        target: /etc/nginx/conf.d/default.conf
    networks:
      - traefik-public-4
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      replicas: 1
      restart_policy:
        condition: any
      labels:
        - traefik.enable=true
        - traefik.docker.network=traefik-public-4
        - traefik.http.routers.grimseth-frontpage.rule=Host(`grimseth.no`)
        - traefik.http.routers.grimseth-frontpage.entrypoints=websecure
        - traefik.http.routers.grimseth-frontpage.tls.certresolver=le
        - traefik.http.routers.grimseth-frontpage.service=grimseth-frontpage
        - traefik.http.routers.grimseth-frontpage-http.rule=Host(`grimseth.no`)
        - traefik.http.routers.grimseth-frontpage-http.entrypoints=web
        - traefik.http.routers.grimseth-frontpage-http.middlewares=redirect-to-https
        - traefik.http.routers.grimseth-frontpage-http.service=grimseth-frontpage
        - traefik.http.middlewares.redirect-to-https.redirectscheme.scheme=https
        - traefik.http.services.grimseth-frontpage.loadbalancer.server.port=80

configs:
  frontpage_html:
    external: true
    name: grimseth-frontpage-index-v1
  frontpage_favicon:
    external: true
    name: grimseth-frontpage-favicon-v1
  frontpage_nginx:
    external: true
    name: grimseth-frontpage-nginx-v1

networks:
  traefik-public-4:
    external: true
